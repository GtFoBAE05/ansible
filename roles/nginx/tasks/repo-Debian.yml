---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: "{{ nginx_apt_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the nginx repository signing key
  ansible.builtin.get_url:
    # nginx_signing.key is an ASCII-armored PGP public key, referenced via
    # signed-by as-is (no manual gpg --dearmor step needed).
    url: "{{ nginx_signing_key_url }}"
    dest: "{{ nginx_apt_keyring_dir }}/nginx.asc"
    owner: root
    group: root
    mode: "0644"
    force: false
  register: _nginx_repo_key
  retries: 3
  delay: 5
  until: _nginx_repo_key is succeeded

- name: Configure the official nginx apt repository
  ansible.builtin.apt_repository:
    # ansible_distribution is "Ubuntu" or "Debian"; nginx.org serves matching
    # paths (packages/ubuntu, packages/debian), with mainline under a /mainline
    # prefix. The suite is the release codename (e.g. noble, bookworm).
    repo: >-
      deb [signed-by={{ nginx_apt_keyring_dir }}/nginx.asc]
      https://nginx.org/packages/{{ 'mainline/' if nginx_repo_channel == 'mainline' else '' }}{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} nginx
    filename: nginx
    state: present
    update_cache: true
