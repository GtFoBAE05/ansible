---
- name: Restart podman app service
  ansible.builtin.systemd_service:
    name: "{{ podman_app_service_name }}"
    scope: user
    daemon_reload: true
    state: restarted
  become: true
  become_user: "{{ podman_app_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ podman_app_xdg_runtime_dir }}"
  when:
    - podman_app_restart_on_change
    - podman_app_state == 'present'
    - not ansible_check_mode
