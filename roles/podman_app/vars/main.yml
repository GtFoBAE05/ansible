---
# Internal constants. Do not override from inventory or playbooks.

# Rootless Quadlet unit directory, relative to the service account home.
podman_app_quadlet_subdir: .config/containers/systemd

podman_app_quadlet_dir: "{{ podman_app_home }}/{{ podman_app_quadlet_subdir }}"
podman_app_unit_file: "{{ podman_app_quadlet_dir }}/{{ podman_app_name }}.container"

# systemd unit generated by Quadlet from <name>.container.
podman_app_service_name: "{{ podman_app_name }}.service"

# Runtime directory for the per-user systemd instance. Required for any
# `systemctl --user` call made over a non-login become session.
podman_app_xdg_runtime_dir: "/run/user/{{ podman_app_uid }}"

podman_app_linger_marker: "/var/lib/systemd/linger/{{ podman_app_user }}"

# Valid values for parameters constrained to an enumeration.
podman_app_valid_restart_policies:
  - "no"
  - on-success
  - on-failure
  - on-abnormal
  - on-watchdog
  - on-abort
  - always

podman_app_valid_autoupdate:
  - ""
  - registry
  - local

podman_app_valid_states:
  - present
  - absent
