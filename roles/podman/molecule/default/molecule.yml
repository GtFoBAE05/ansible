---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
driver:
  name: docker
platforms:
  - name: podman-ubuntu2404
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    pre_build_image: true
    privileged: true
    # The docker driver otherwise overrides the image CMD with its own
    # keep-alive command, replacing the systemd entrypoint these images ship
    # (PID 1 becomes `bash`, not `systemd`) and breaking anything that needs a
    # real init system (loginctl, systemctl --user, linger).
    override_command: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - podman_hosts
  - name: podman-rockylinux9
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    pre_build_image: true
    privileged: true
    # The docker driver otherwise overrides the image CMD with its own
    # keep-alive command, replacing the systemd entrypoint these images ship
    # (PID 1 becomes `bash`, not `systemd`) and breaking anything that needs a
    # real init system (loginctl, systemctl --user, linger).
    override_command: false
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    groups:
      - podman_hosts
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    group_vars:
      podman_hosts:
        podman_rootless_users:
          - name: molecule_app
            count: 65536
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
